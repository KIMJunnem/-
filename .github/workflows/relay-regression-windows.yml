name: relay-regression-windows

on:
  push:
    branches:
      - ci/relay-regression-diagnose-20260927
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Quote result order Windows
        shell: cmd
        run: node tests\quote-result-order.cjs
        env:
          NODE_ENV: test
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          CLAUDE_API_KEY: ""
      - name: Full regression Windows
        shell: cmd
        run: node tests\run-all.cjs
        env:
          NODE_ENV: test
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          CLAUDE_API_KEY: ""
