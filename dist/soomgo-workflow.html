<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Relay Desk · 숨고 의뢰 상세</title>
  <style>
    :root{color-scheme:dark;--bg:#090e19;--panel:#111a2b;--ink:#eaf0fa;--muted:#9baac0;--soft:#7586a1;--line:#27344b;--mint:#73e2c2;--blue:#9fc4ff;--amber:#ffc866;--red:#ff8290}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(1000px 500px at 20% -15%,#18264a 0%,transparent 65%),var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:0 auto;padding:20px 24px 64px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{font-weight:800;letter-spacing:.02em}.top a,.button,.download{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line);background:#121a2d;color:var(--ink);padding:9px 13px;border-radius:9px;font-size:12px}.hero,.panel{border:1px solid var(--line);border-radius:15px;background:rgba(15,23,40,.92);overflow:hidden;margin-bottom:14px}.hero{padding:22px;background:linear-gradient(145deg,#121b30,#0d1424)}.hero-line{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.hero h1{font-size:23px;margin:0 0 7px}.sub{color:var(--muted);font-size:12px;line-height:1.65}.badge{display:inline-flex;padding:6px 9px;border-radius:7px;background:#1c2a44;color:var(--blue);font-size:11px;font-weight:700;white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel h2{font-size:14px;margin:0}.head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.body{padding:16px 18px}.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid #202b41;font-size:12px}.kv:last-child{border-bottom:0}.k{color:var(--soft)}.v{line-height:1.65;overflow-wrap:anywhere}.price{font-size:22px;font-weight:800;color:var(--mint)}.muted{color:var(--muted)}.notice{margin-top:12px;padding:12px;border-radius:10px;background:#101e32;border:1px solid #263a59;color:var(--muted);font-size:11px;line-height:1.7}.notice.danger{background:#29161e;border-color:#8b3543;color:#ffe0e4}.notice.danger strong{color:#ff9aa5}.notice.ok{background:#10251f;border-color:#27735f;color:#b9f8e7}.file,.result,.note{padding:13px 0;border-bottom:1px solid #202b41}.file:last-child,.result:last-child,.note:last-child{border-bottom:0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.file-name,.result-title{font-size:12px;font-weight:700;overflow-wrap:anywhere}.meta{font-size:10px;color:var(--soft);line-height:1.7;margin-top:4px}.download{background:#172641;border-color:#314b71;color:#c8dcff;white-space:nowrap}.preview{margin-top:10px;border:1px solid #28354e;border-radius:9px;background:#0b1221}.preview summary{cursor:pointer;padding:9px 11px;color:var(--muted);font-size:11px}.preview pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:440px;overflow:auto;padding:0 11px 12px;margin:0;color:#dbe4f3;font-size:11px;line-height:1.65}.empty{padding:16px 0;color:var(--soft);font-size:12px}.note-form textarea{width:100%;min-height:110px;resize:vertical;background:#0b1221;color:var(--ink);border:1px solid #33415c;border-radius:10px;padding:12px;outline:none;font-size:12px;line-height:1.6}.note-form textarea:focus,select:focus,input:focus{border-color:#5e8bd4;outline:none}.note-form footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}.primary{border:0;background:var(--mint);color:#07171a;padding:10px 15px;border-radius:9px;font-weight:800;cursor:pointer}.primary:disabled{opacity:.5;cursor:not-allowed}.toast{min-height:16px;color:var(--muted);font-size:11px}.loading{padding:22px;color:var(--muted);font-size:12px}.status{color:var(--amber)}.ok-text{color:var(--mint)}.danger-text{color:var(--red)}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.controls select,.file-input{max-width:100%;background:#0b1221;color:var(--ink);border:1px solid #33415c;border-radius:9px;padding:9px 11px}.danger-box{margin-top:14px;padding:14px;border:1px solid #8b3543;border-radius:11px;background:#23141c}.danger-box h3{margin:0 0 6px;color:#ff9aa5;font-size:13px}.danger-box p,.danger-box li{font-size:11px;color:#f4d6dc;line-height:1.65}.danger-box ul{margin:8px 0;padding-left:20px}.confirm-row{display:flex;align-items:flex-start;gap:9px;margin:13px 0;font-size:11px;color:#ffe8eb}.confirm-row input{margin-top:3px;accent-color:#fa7180}.danger-button{border:0;background:#aa3f52;color:white;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer}.file-input{font-size:11px}.price-note{padding:12px;border-radius:10px;background:#101e32;color:#bdcbe0;font-size:11px;line-height:1.7}.pill-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid #33415c;border-radius:999px;padding:4px 8px;font-size:10px;color:#ccdaee}.pill.warn{border-color:#8b3543;color:#ffabb4}@media(max-width:760px){.wrap{padding:14px 12px 44px}.grid{grid-template-columns:1fr}.hero{padding:17px}.hero h1{font-size:20px}.kv{grid-template-columns:105px minmax(0,1fr)}.row{align-items:flex-start}.download{font-size:10px;padding:8px}.top{margin-bottom:13px}.hero-line{flex-direction:column}.controls{align-items:stretch}.controls>*{flex:1}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><div class="brand">Relay Desk · 숨고 의뢰</div><a href="/">← 진행 현황</a></header>
    <div id="app" class="loading">고용 확정 의뢰 상세를 불러오는 중입니다.</div>
  </main>
  <script>
    (()=>{
      const app=document.getElementById('app');
      const workflowId=new URLSearchParams(location.search).get('workflowId')||'';
      let busy=false;
      const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const date=value=>{const d=new Date(value||'');return Number.isNaN(d.getTime())?'기록 없음':d.toLocaleString('ko-KR')};
      const bytes=value=>{const n=Number(value||0);return n<1024?`${n}B`:n<1048576?`${(n/1024).toFixed(1)}KB`:`${(n/1048576).toFixed(2)}MB`};
      const labels={awaiting_first_result:'AI 작업 대기',quality_review_running:'교차검증 중',awaiting_feedback:'1차 결과 전달·피드백 대기',revision_running:'수정 작업 중',awaiting_completion_confirmation:'최종 결과 전달·확인 대기',payment_ready:'숨고페이 요청 준비',payment_requested:'고객 결제 대기',payment_confirmed_delivery_pending:'결제 확인·결과 전달 준비',transaction_confirmation_wait:'거래 확정 요청 대기(3시간)',transaction_replacement_pending:'기존 거래 취소·새 결제 준비',review_requested:'리뷰 요청 대기',completed:'완료'};
      async function action(actionName,payload={},statusId='actionStatus'){
        const status=document.getElementById(statusId);if(busy)return;busy=true;if(status)status.textContent='처리 중…';
        try{const response=await fetch('/api/soomgo/workflow/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({workflowId,action:actionName,...payload})});const data=await response.json().catch(()=>({}));if(!response.ok){const messages={confirm_previous_wrong_format_not_sent:'숨고 채팅에서 기존 파일이 전송되지 않았는지 확인한 뒤 체크해 주세요.',quality_passes_locked_after_first_delivery:'첫 결과 파일이 전달되기 전의 작업에서만 검수 회수를 늘릴 수 있습니다.',exe_pe_signature_invalid:'Windows PE 형식의 EXE 파일이 아닙니다.',exe_not_requested:'요청 파일 형식에 EXE가 포함되어 있지 않습니다.',rebuild_requested_files_first:'먼저 Word·Excel 등 나머지 요청 형식 파일을 다시 생성해 주세요.',exe_build_and_runtime_test_confirmation_required:'작성자가 Windows에서 빌드와 실행 테스트를 마쳤다는 확인이 필요합니다.',at_least_one_supported_format_required:'요청한 파일 형식을 하나 이상 선택해 주세요.'};throw new Error(messages[data.error]||data.message||data.error||'요청을 처리하지 못했습니다.')}if(status)status.textContent=data.formatIssue?.message||data.workflow?.formatIssue?.message||'저장했습니다. 변경 사항을 확인합니다.';await load();return data}catch(error){if(status)status.textContent=error.message;return null}finally{busy=false}}
      async function uploadExe(file){if(!file)return;const status=document.getElementById('formatStatus');if(file.size>20*1024*1024){status.textContent='EXE는 20MB 이하 파일만 등록할 수 있습니다.';return}const confirm=document.getElementById('safeRetryConfirm'),tested=document.getElementById('exeTestConfirm');if(!confirm?.checked){status.textContent='기존 파일이 고객에게 전송되지 않은 것을 확인해 주세요.';return}if(!tested?.checked){status.textContent='작성자가 Windows에서 빌드하고 실제 실행 테스트를 마쳤는지 확인해 주세요.';return}busy=true;status.textContent='EXE 파일을 확인하고 Relay Desk에 등록 중…';try{const bytesView=new Uint8Array(await file.arrayBuffer());let binary='';const chunk=0x8000;for(let i=0;i<bytesView.length;i+=chunk)binary+=String.fromCharCode(...bytesView.subarray(i,i+chunk));const dataBase64=btoa(binary);const response=await fetch('/api/soomgo/workflow/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({workflowId,action:'upload_exe',name:file.name,dataBase64,confirmSafeRetry:true,confirmExeTested:true})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error==='exe_pe_signature_invalid'?'Windows PE 형식의 EXE 파일이 아닙니다.':data.error==='rebuild_requested_files_first'?'먼저 Word·Excel 등 나머지 요청 형식 파일을 다시 생성해 주세요.':data.error||'EXE 등록 실패');status.textContent=data.formatIssue?.message||'EXE 등록 완료 · 요청 형식을 다시 확인합니다.';await load()}catch(error){status.textContent=error.message}finally{busy=false}}
      function render(data){
        const w=data.workflow||{},r=w.request||{},q=w.quote||{},issue=w.formatIssue||null;
        const promo=`원가 ${Number(q.originalAmount||q.regularAmount||0).toLocaleString('ko-KR')}원 → 오픈 기념 30% 할인 ${Number(q.amount||0).toLocaleString('ko-KR')}원`;
        const tasks=Array.isArray(data.tasks)?data.tasks:[],results=Array.isArray(data.resultPosts)?data.resultPosts:[],files=Array.isArray(data.files)?data.files:[],notes=Array.isArray(w.ownerNotes)?w.ownerNotes:[];
        const allFiles=new Map();
        for(const file of files)if(file?.serverPath)allFiles.set(file.serverPath,file);
        for(const file of w.pendingDelivery?.files||[])if(file?.serverPath)allFiles.set(file.serverPath,{...file,status:w.pendingDelivery.deliveredAt?'전달 완료':'전달 대기',capturedAt:w.pendingDelivery.createdAt});
        for(const result of results)for(const artifact of result?.artifacts||[result?.artifact])if(artifact?.serverPath&&!allFiles.has(artifact.serverPath))allFiles.set(artifact.serverPath,{...artifact,taskId:result.taskId,status:result.status,capturedAt:result.createdAt});
        const fileRows=[...allFiles.values()].sort((a,b)=>String(b.capturedAt||b.uploadedAt||'').localeCompare(String(a.capturedAt||a.uploadedAt||''))).map(f=>`<div class="file"><div class="row"><div><div class="file-name">${esc(f.name||f.originalName||'결과 파일')}</div><div class="meta">${esc(f.status||'저장됨')} · ${esc(bytes(f.size))} · ${esc(date(f.capturedAt||f.uploadedAt))}${f.sha256?` · SHA ${esc(String(f.sha256).slice(0,12))}…`:''}</div></div><a class="download" href="${esc(f.serverPath)}" download="${esc(f.name||f.originalName||'relay-result')}">다운로드</a></div></div>`).join('')||'<div class="empty">아직 저장된 결과 파일이 없습니다. AI 작성·각 교차검수 결과가 생성되면 여기에서 내려받을 수 있습니다.</div>';
        const resultRows=results.slice().reverse().map((p,index)=>`<article class="result"><div class="row"><div><div class="result-title">${esc(p.title||`중간 결과 ${index+1}`)}</div><div class="meta">${esc(p.provider||'AI')} · ${esc(p.model||'')} · ${esc(date(p.createdAt))}${p.productionCost?` · 원가 ${p.productionCost.estimatedCostKrw!=null?`약 ${Number(p.productionCost.estimatedCostKrw).toLocaleString('ko-KR')}원`:'미기록'}`:''}${p.astraGrade?.status==='completed'?` · Astra ${esc(p.astraGrade.score)}/100`:''}</div></div>${p.artifact?.serverPath?`<a class="download" href="${esc(p.artifact.serverPath)}" download="${esc(p.artifact.name||'relay-result')}">이 버전 받기</a>`:''}</div><details class="preview"><summary>결과 미리보기</summary><pre>${esc(p.text||'결과 내용 없음')}</pre></details></article>`).join('')||'<div class="empty">아직 저장된 중간 결과가 없습니다.</div>';
        const noteRows=notes.slice().reverse().map(n=>`<div class="note"><div class="v">${esc(n.text)}</div><div class="meta">${esc(date(n.createdAt))} · 반영 대상: ${esc(n.appliedTo||'다음 검수')}</div></div>`).join('')||'<div class="empty">추가 지시 기록이 없습니다.</div>';
        const readOnly=Boolean(data.readOnly),passes=Math.max(10,Number(w.qualityPasses||10)),canIncreaseBeforeDelivery=['awaiting_first_result','quality_review_running'].includes(String(w.stage||'')),canReviewUnsent=Boolean(w.pendingDelivery&&!w.pendingDelivery.deliveredAt&&['awaiting_feedback','awaiting_completion_confirmation'].includes(String(w.stage||''))),passLocked=!(canIncreaseBeforeDelivery||canReviewUnsent),plan=w.qualityProviderPlan||{},counts=plan.counts||{},astraReports=Array.isArray(w.astraReviewReports)?w.astraReviewReports:[];
        const astraRows=astraReports.map(report=>{const completed=report.status==='completed';const criteria=(report.criteria||[]).map(item=>`<div class="kv"><div class="k">${esc(item.label||item.key||'항목')} <strong>${esc(item.score)}/${esc(item.max)}</strong></div><div class="v">${esc(item.evidence||'근거 기록 없음')}${item.deduction?`<br><span class="danger-text">감점: ${esc(item.deduction)}</span>`:''}</div></div>`).join('');return `<article class="result"><div class="row"><div><div class="result-title">${esc(report.final?'최종 채점':'중간 채점')} · ${esc(report.cycle)}회차</div><div class="meta">Astra · ${esc(date(report.gradedAt))}</div></div><span class="badge ${completed&&Number(report.score)>=90?'ok-text':completed&&Number(report.score)<80?'danger-text':'status'}">${completed?`${esc(report.score)}/100 · ${esc(report.decision)}`:esc(report.status||'대기')}</span></div>${completed?`<div class="meta" style="margin-top:9px">${esc(report.summary||'')} </div>${criteria}${(report.requiredFixes||[]).length?`<div class="notice danger"><strong>다음 수정 근거</strong><br>${report.requiredFixes.map(item=>`· ${esc(item)}`).join('<br>')}</div>`:''}`:`<div class="notice">${esc(report.reason||'Astra 채점 결과를 기다리는 중입니다.')}</div>`}</article>`}).join('')||'<div class="empty">아직 Astra 채점 기록이 없습니다. 검수 결과가 저장될 때마다 교수 채점이 추가됩니다.</div>';
        const paymentPlan=w.paymentPlan||{};
        const transactionNotice=w.stage==='payment_ready'?(paymentPlan.split?`숨고페이 ${paymentPlan.round>=2?'잔금':'착수금'} ${Number(paymentPlan.requestAmount||w.paymentAmount||0).toLocaleString('ko-KR')}원 요청을 먼저 보냅니다. 총액 ${Number(paymentPlan.totalAmount||q.amount||0).toLocaleString('ko-KR')}원.`:`숨고페이 전액 ${Number(paymentPlan.requestAmount||w.paymentAmount||q.amount||0).toLocaleString('ko-KR')}원 요청을 먼저 보냅니다.`):w.stage==='payment_requested'?'고객 결제 완료 표시를 확인하는 중입니다.':w.stage==='payment_confirmed_delivery_pending'?'결제 확인 완료 · 결과 파일을 채팅으로 전달하는 중입니다.':w.stage==='transaction_confirmation_wait'?`결제 완료 후 3시간 대기 중입니다. 거래 확정 요청 가능 시각: ${esc(date(w.transactionConfirmReadyAt))}`:w.stage==='transaction_replacement_pending'?`추가 작업 동의 완료 · 기존 거래 취소 후 최종금액 ${Number(w.paymentAmount||0).toLocaleString('ko-KR')}원으로 새 결제를 등록합니다.`:w.stage==='review_requested'?'거래 확정 요청 완료 · 고객 리뷰 요청 단계입니다.':'';
        const providerPills=`<span class="pill">Astra (gpt-6-astra) ${Number(w.qualityPasses||10)}회</span>`;
        const missing=(issue?.missing||[]).map(item=>`<li><strong>${esc(item.label)} (.${esc(item.extension)})</strong> · ${esc(item.reason||'실제 형식 파일이 없습니다.')}</li>`).join('');
        const formatMismatch=issue?.code==='format_mismatch';
        const normalizeFormat=key=>({word:'docx',excel:'xlsx',windows:'exe'}[key]||key);
        const formatHints=[r.format,r.volume,r.topic,r.text,...notes.map(note=>note.text||'')].join(' ').toLowerCase();
        const selectedRaw=issue?.requiredKeys?.length?issue.requiredKeys:(r.requiredFormats||[]);
        const selectedFormats=new Set(selectedRaw.map(normalizeFormat));
        if(/word|워드|\.docx/.test(formatHints))selectedFormats.add('docx');
        if(/excel|엑셀|\.xlsx/.test(formatHints))selectedFormats.add('xlsx');
        if(/python|파이썬|\.py\b/.test(formatHints))selectedFormats.add('py');
        if(/\bexe\b|실행\s*파일|\.exe/.test(formatHints))selectedFormats.add('exe');
        if(/한글|hwp|\.hwpx?/.test(formatHints)){selectedFormats.add('hwp');selectedFormats.add('hwpx')}
        const formatOptions=[['docx','Word (.docx)'],['hwp','한글 HWP (.hwp)'],['hwpx','한글 HWPX (.hwpx)'],['xlsx','Excel (.xlsx)'],['py','Python (.py)'],['exe','실행 파일 (.exe)'],['csv','CSV (.csv)'],['srt','자막 (.srt)'],['vtt','자막 (.vtt)'],['pdf','PDF (.pdf)'],['mp4','편집 영상 (.mp4)']];
        const formatEditor=`<form id="formatForm"><p>고객 요청 형식을 선택하세요. 이 설정은 상세 화면에 항상 표시되며, 선택한 실제 파일이 모두 준비되기 전에는 고객에게 보내지 않습니다.</p><div class="pill-list">${formatOptions.map(([key,label])=>`<label class="pill"><input type="checkbox" name="requiredFormat" value="${key}" ${selectedFormats.has(key)?'checked':''} ${readOnly?'disabled':''}> ${label}</label>`).join('')}</div><button class="primary" style="margin-top:10px" ${readOnly?'disabled':''}>요청 형식 저장</button></form>`;
        const formatSetupPanel=`<section class="panel"><div class="head"><h2>납품 파일 형식 선택</h2><span class="badge">항상 표시</span></div><div class="body">${formatEditor}</div></section>`;
        const repairPanel=formatMismatch?`<div class="danger-box"><h3>! 고객 요청과 결과 파일 형식 불일치 · 고객 전달 차단</h3><p>${esc(issue.message||'형식이 맞지 않아 파일 전송을 막았습니다.')}</p><p>요청: ${(issue.requested||[]).map(esc).join(', ')||esc(r.format||'요청 형식 미기록')}<br>현재 결과: ${(issue.available||[]).map(esc).join(', ')||'등록된 납품 파일 없음'}</p><ul>${missing}</ul><label class="confirm-row"><input id="safeRetryConfirm" type="checkbox" ${readOnly?'disabled':''}><span>숨고 채팅 기록을 확인했고, 기존 형식 오류 파일은 고객에게 전송되지 않았음을 확인했습니다. 이 확인 뒤에만 다시 만듭니다.</span></label><div class="controls"><button class="danger-button" id="rebuildButton" ${readOnly?'disabled':''}>요청 형식으로 결과 다시 생성</button></div><div id="formatStatus" class="toast" role="status"></div></div>`:'';
        const reviewHoldPanel=issue?.code==='quality_extension_pending'?`<div class="danger-box"><h3>! 추가 교차검수 진행 중 · 기존 파일 전송 보류</h3><p>${esc(issue.message||'검수 완료 전에는 기존 결과를 고객에게 보내지 않습니다.')}</p><p>요청 형식: ${(issue.requested||[]).map(esc).join(', ')}<br>현재 저장 파일: ${(issue.available||[]).map(esc).join(', ')||'등록된 납품 파일 없음'}</p></div>`:'';
        const exeBuildPanel=issue?.code==='author_build_pending'?`<div class="danger-box"><h3>! EXE는 작성자 빌드·실행 검증 후 등록해야 합니다</h3><p>${esc(issue.message||'실제 실행 파일이 등록될 때까지 고객 전달을 보류합니다.')}</p><p>요청: ${(issue.requested||[]).map(esc).join(', ')}<br>현재 파일: ${(issue.available||[]).map(esc).join(', ')||'작업 진행 중 · 결과 대기'}</p>${w.pendingDelivery?`<label class="confirm-row"><input id="safeRetryConfirm" type="checkbox" ${readOnly?'disabled':''}><span>숨고 채팅 기록을 확인했고, 기존 TXT와 현재 Word·Excel 결과가 아직 고객에게 전송되지 않았음을 확인합니다.</span></label><div class="controls"><input class="file-input" id="exeFile" type="file" accept=".exe,application/vnd.microsoft.portable-executable" ${readOnly?'disabled':''}></div><label class="confirm-row"><input id="exeTestConfirm" type="checkbox" ${readOnly?'disabled':''}><span>작성자가 Windows에서 직접 빌드해 실행 테스트를 완료한 파일임을 확인합니다.</span></label><p>Relay Desk는 EXE의 MZ/PE 서명만 확인합니다. 악성코드 검사와 실행 테스트는 수행하지 않습니다. 작성자 사양·소스는 결과 파일 목록에서 따로 내려받아 전달할 수 있습니다.</p><div id="formatStatus" class="toast" role="status"></div>`:'<p>Word·Excel 재제작과 교차검수 큐가 진행 중입니다. 완료되면 작성자용 EXE 사양·소스와 실제 파일 업로드 칸을 표시합니다.</p>'}</div>`:'';
        app.className='';
        app.innerHTML=`<section class="hero"><div class="hero-line"><div><h1>${esc(r.purpose||q.label||'숨고 의뢰')}</h1><div class="sub">요청 ID ${esc(w.requestId||'')} · 고용 확정 ${esc(date(data.lead?.hiredAt||w.createdAt))}<br>작업 ${esc(tasks.find(t=>t.id===w.currentTaskId)?.id||w.currentTaskId||w.taskId||'')}</div></div><span class="badge">${esc(labels[w.stage]||w.stage||'상태 확인 중')}</span></div><div class="notice ${issue?.blocked?'danger':'ok'}">${issue?.blocked?`<strong>고객 전달은 막혀 있습니다.</strong> ${esc(issue.message||'요청 형식과 파일을 확인해 주세요.')}`:`고객 전달: 요청한 실제 파일 형식으로 결과물을 생성합니다. ${Number(w.qualityPasses||10)}회 독립 교차검수 후 1차 파일을 숨고 채팅에 첨부하고, 피드백 반영 후 최종 파일을 같은 채팅방으로 보냅니다. <strong>검수 1회는 검토 후 실제 제작·수정까지 완료한 한 사이클이며, 각 회차에 Astra 채점이 포함됩니다.</strong> 현재 검수 ${Number(w.qualityCompleted||0)}/${Number(w.qualityPasses||10)}회.`} 첨부·전송 확인 전에는 완료 처리하지 않습니다.${transactionNotice?`<br><strong>${transactionNotice}</strong>`:''}</div>${repairPanel}${reviewHoldPanel}${exeBuildPanel}</section>
          <div class="grid"><section class="panel"><div class="head"><h2>견적 및 작업 조건</h2><span class="badge">${esc(q.tier||'')}</span></div><div class="body"><div class="kv"><div class="k">고객 견적</div><div class="v price">${Number(q.amount||0).toLocaleString('ko-KR')}원</div></div><div class="kv"><div class="k">가격 기준</div><div class="v">${esc(promo)}${q.regularAmount?` · ${Number(q.regularAmount).toLocaleString('ko-KR')}원`:''}</div></div><div class="kv"><div class="k">예상 납기</div><div class="v">${esc(q.days||'협의')}</div></div><div class="kv"><div class="k">요청 파일</div><div class="v">${esc(r.format||'협의')}</div></div><div class="kv"><div class="k">분량</div><div class="v">${esc(r.volume||'미기록')}</div></div><div class="kv"><div class="k">주제</div><div class="v">${esc(r.topic||'미기록')}</div></div><div class="kv"><div class="k">기본 범위</div><div class="v">${esc(q.basicScope||'견적 기록 없음')}</div></div><div class="kv"><div class="k">추가금 기준</div><div class="v">${esc(q.extraScope||'견적 기록 없음')}</div></div></div></section>
          <section class="panel"><div class="head"><h2>교차검수 회수 및 담당 AI</h2><span class="badge">${Number(w.qualityCompleted||0)}/${passes}회 완료</span></div><div class="body"><div class="price-note">제작·수정·채점은 모두 gpt-6-astra로 실행하고 회차별 결과물 원가를 기록합니다.<div class="pill-list">${providerPills||'<span class="pill">배정 정보 없음</span>'}</div></div><div class="controls" style="margin-top:13px"><label for="passSelect" class="muted">총 검수 회수</label><select id="passSelect" ${readOnly||passLocked||passes>=20?'disabled':''}>${Array.from({length:21-passes},(_,i)=>passes+i).map(value=>`<option value="${value}" ${value===passes?'selected':''}>${value}회</option>`).join('')}</select><button class="primary" id="savePasses" ${readOnly||passLocked||passes>=20?'disabled':''}>검수 회수 늘리기</button></div><div id="passStatus" class="toast" style="margin-top:8px">${readOnly?'읽기 전용입니다.':passLocked?'전달 대기 결과가 없거나 고객에게 이미 보낸 의뢰입니다.':canReviewUnsent?'고객 미전달 결과는 추가 검수 큐를 실행하고 완료 후 다시 만듭니다.':'검수가 끝나기 전 회수를 늘릴 수 있으며, 줄이는 변경은 허용하지 않습니다.'}</div></div></section></div>
          <section class="panel"><div class="head"><h2>Astra 교수 채점</h2><span class="badge">${astraReports.filter(item=>item.status==='completed').length}회 기록</span></div><div class="body"><div class="price-note">각 결과물을 과제로 보고 Astra가 100점 만점으로 보수 채점합니다. A등급(90점 이상)이고 필수 수정사항이 없어야 고객 전달이 가능합니다. 점수·근거·감점 항목은 작업물 버전과 함께 저장됩니다.</div>${astraRows}</div></section>
          <section class="panel"><div class="head"><h2>제작 설정</h2><span class="badge">${esc(tasks.length)}개 작업</span></div><div class="body">${tasks.map(t=>`<div class="kv"><div class="k">${esc(t.id===w.currentTaskId?'현재 작업':'작업')}</div><div class="v">${esc(t.title||t.id)}<br><span class="muted">${esc(t.ai||'AI 미지정')} · ${esc(t.label||t.status||'')}</span>${Array.isArray(t.qualityPlan?.gates)?`<div class="meta">검수: ${esc(t.qualityPlan.gates.join(' → '))}</div>`:''}</div></div>`).join('')||'<div class="empty">등록된 작업 설정이 없습니다.</div>'}</div></section>
          <section class="panel"><div class="head"><h2>결과 파일 및 중간 버전</h2><span class="badge">${allFiles.size}개 파일</span></div><div class="body">${fileRows}</div></section>
          <section class="panel"><div class="head"><h2>AI 결과 기록</h2><span class="badge">${results.length}개</span></div><div class="body">${resultRows}</div></section>
          <section class="panel"><div class="head"><h2>중간 지시 추가</h2><span class="badge">${readOnly?'읽기 전용':'다음 검수·수정에 반영'}</span></div><div class="body"><form class="note-form" id="noteForm"><textarea id="noteText" maxlength="2000" placeholder="예: 표는 한 개만 넣고, 결론은 3문장 이내로 정리해 주세요." ${readOnly?'disabled':''}></textarea><footer><span class="toast" id="noteStatus">${readOnly?'원격 보기 모드에서는 지시를 저장할 수 없습니다.':'작업 중인 결과에 추가 지시를 기록합니다.'}</span><button class="primary" ${readOnly?'disabled':''}>지시 저장</button></footer></form><div id="notes">${noteRows}</div></div></section>`;
        app.insertAdjacentHTML('afterbegin',formatSetupPanel);
        document.getElementById('savePasses')?.addEventListener('click',()=>action('set_quality_passes',{passes:Number(document.getElementById('passSelect')?.value||passes)},'passStatus'));
        document.getElementById('formatForm')?.addEventListener('submit',event=>{event.preventDefault();const requiredFormats=[...event.currentTarget.querySelectorAll('input[name="requiredFormat"]:checked')].map(input=>input.value);action('set_required_formats',{requiredFormats},'formatStatus')});
        document.getElementById('rebuildButton')?.addEventListener('click',()=>{const confirm=document.getElementById('safeRetryConfirm');if(!confirm?.checked){document.getElementById('formatStatus').textContent='숨고 채팅 기록을 확인하고 위 항목에 체크해 주세요.';return}action('rebuild_delivery_files',{confirmSafeRetry:true},'formatStatus')});
        document.getElementById('exeFile')?.addEventListener('change',event=>uploadExe(event.target.files?.[0]));
        document.getElementById('noteForm')?.addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,box=document.getElementById('noteText'),status=document.getElementById('noteStatus'),button=form.querySelector('button'),text=box.value.trim();if(text.length<2){status.textContent='지시 내용을 두 글자 이상 입력해 주세요.';return}button.disabled=true;status.textContent='저장 중…';try{const response=await fetch('/api/soomgo/workflow/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({workflowId:w.id,action:'owner_note',text})});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||'지시를 저장하지 못했습니다.');box.value='';status.textContent=`저장 완료 · ${payload.note?.appliedTo||'다음 검수에 반영'}`;await load()}catch(error){status.textContent=error.message}finally{button.disabled=false}});
      }
      async function load(){if(!workflowId){app.textContent='의뢰 ID가 없습니다.';return}try{const response=await fetch(`/api/soomgo/workflow/detail?workflowId=${encodeURIComponent(workflowId)}`,{cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'의뢰를 불러오지 못했습니다.');render(data)}catch(error){app.textContent=`의뢰 정보를 불러오지 못했습니다: ${error.message}`;app.className='loading status'}}
      load();setInterval(()=>{if(!busy&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))load()},10000);
    })();
  </script>
  <script>
    (()=>{
      const fmtTokens=value=>Number(value||0).toLocaleString('ko-KR');
      const fmtCost=value=>Number.isFinite(Number(value))?`$${Number(value).toFixed(6)}`:'미기록';
      const usageOf=usage=>{const u=usage||{};const input=Number(u.input_tokens||u.promptTokenCount||u.prompt_tokens||0);const output=Number(u.output_tokens||u.candidatesTokenCount||u.completion_tokens||0);const total=Number(u.total_tokens||u.totalTokenCount||input+output);return {input,output,total}};
      async function renderAstraUsage(){
        const id=new URLSearchParams(location.search).get('workflowId'); if(!id)return;
        try{const response=await fetch(`/api/soomgo/workflow/detail?workflowId=${encodeURIComponent(id)}`,{cache:'no-store'});if(!response.ok)return;const data=await response.json();const reports=Array.isArray(data.workflow?.astraReviewReports)?data.workflow.astraReviewReports:[];let panel=document.getElementById('astraTokenUsage');if(!panel){panel=document.createElement('section');panel.id='astraTokenUsage';panel.className='panel';document.querySelector('.hero')?.insertAdjacentElement('afterend',panel)}if(!panel)return;const rows=reports.map(report=>{const u=usageOf(report.usage);return `<div class="kv"><div class="k">${report.final?'최종 채점':'중간 채점'} · ${String(report.cycle||'-')}회차</div><div class="v">입력 ${fmtTokens(u.input)} · 출력 ${fmtTokens(u.output)} · 총 ${fmtTokens(u.total)} 토큰 · 비용 ${fmtCost(report.usageSummary?.estimatedCostUsd)} · 응답 ID ${String(report.providerResponseId||'미기록')}</div></div>`}).join('');panel.innerHTML=`<div class="head"><h2>Astra 검수 토큰 사용량</h2><span class="badge">검수 완료 후 기록</span></div><div class="body"><div class="price-note">검수 1회가 끝날 때마다 실제 Astra API 사용량과 추정 비용을 저장해 표시합니다.</div>${rows||'<div class="empty">아직 완료된 Astra 검수 사용량이 없습니다.</div>'}</div>`}catch(_){}}
      renderAstraUsage();setInterval(renderAstraUsage,10000);
    })();
  </script>
</body>
</html>
