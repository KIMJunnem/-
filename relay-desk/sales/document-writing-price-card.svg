#6d6680" font-size="17">기준가 35,000원</text><text x="648" y="671" fill="#5d35d6" font-size="27" font-weight="700">오픈 30% 할인 25,000원</text><text x="648" y="711" fill="#6d6680" font-size="16">원고·자료 제공 · 기본 구성</text><text x="648" y="736" fill="#6d6680" font-size="16">10장 안팎 기준</text><rect x="80" y="780" width="500" height="205" rx="20" fill="#f5f1ff" stroke="#d9c9ff" stroke-width="2"/><text x="108" y="832" fill="#3d267f" font-size="27" font-weight="700">PPT 템플릿·디자인</text><text x="108" y="867" fill="#6d6680" font-size="17">기준가 84,000원</text><text x="108" y="901" fill="#5d35d6" font-size="27" font-weight="700">오픈 30% 할인 59,000원</text><text x="108" y="941" fill="#6d6680" font-size="16">레이아웃·그래프·이미지</text><text x="108" y="966" fill="#6d6680" font-size="16">분량·난이도별 확정</text><rect x="620" y="780" width="500" height="205" rx="20" fill="#f5f1ff" stroke="#d9c9ff" stroke-width="2"/><text x="648" y="832" fill="#3d267f" font-size="27" font-weight="700">보고서</text><text x="648" y="867" fill="#6d6680" font-size="17">기준가 30,000원</text><text x="648" y="901" fill="#5d35d6" font-size="27" font-weight="700">오픈 30% 할인 21,000원</text><text x="648" y="941" fill="#6d6680" font-size="16">자료 정리·구성 · 수정 1회</text><text x="648" y="966" fill="#6d6680" font-size="16">기본 3쪽 기준</text><rect x="80" y="1010" width="500" height="205" rx="20" fill="#fff" stroke="#d9c9ff" stroke-width="2"/><text x="108" y="1062" fill="#3d267f" font-size="27" font-weight="700">사업계획서 작성</text><text x="108" y="1097" fill="#6d6680" font-size="17">기준가 210,000원</text><text x="108" y="1131" fill="#5d35d6" font-size="27" font-weight="700">오픈 30% 할인 147,000원</text><text x="108" y="1171" fill="#6d6680" font-size="16">목표·실행·예산·성과지표</text><text x="108" y="1196" fill="#6d6680" font-size="16">지원사업·투자용은 범위 확인</text><rect x="620" y="1010" width="500" height="205" rx="20" fill="#fff" stroke="#d9c9ff" stroke-width="2"/><text x="648" y="1062" fill="#3d267f" font-size="27" font-weight="700">리서치·설문 대행</text><text x="648" y="1097" fill="#6d6680" fo